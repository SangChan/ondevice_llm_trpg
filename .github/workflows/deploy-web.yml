name: Deploy web

# 웹앱은 정적 파일뿐이라 서버가 필요 없다. WASM을 CI에서 다시 빌드하고 테스트까지
# 통과한 것만 올린다 — 커밋된 game_core.wasm과 assembly/index.ts가 어긋나면 여기서 걸린다.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # asc로 WASM을 빌드하고 규칙 엔진·파서·narrator 테스트를 돌린다 (모델 다운로드 없음).
      - run: npm test

      # node_modules/테스트/빌드 스크립트는 빼고 실제로 서빙할 것만 모은다.
      - name: Collect the site
        run: |
          mkdir -p ../dist
          cp index.html styles.css ../dist/
          cp -r src ../dist/
          mkdir -p ../dist/build
          cp build/game_core.js build/game_core.wasm ../dist/build/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
